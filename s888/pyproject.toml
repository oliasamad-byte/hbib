[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s888"
version = "0.1.0"
description = "Top Gainers Triple-Track Ranker — Daily Small Cap / Daily Mid+L+M / Weekly"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["s888*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
